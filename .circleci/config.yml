version: 2.1

executors:
  terraform-executor:
    docker:
      - image: cimg/base:stable
    resource_class: medium

jobs:
  terraform-validate:
    executor: terraform-executor
    steps:
      - checkout
      - run:
          name: Install Terraform
          command: |
            curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
            unzip -o /tmp/terraform.zip -d /tmp/terraform-bin
            sudo mv /tmp/terraform-bin/terraform /usr/local/bin/terraform
            terraform version
      - run:
          name: Terraform fmt check
          command: terraform fmt -check -recursive
      - run:
          name: Terraform init
          command: terraform -chdir=modules/s3 init -backend=false
      - run:
          name: Terraform validate
          command: terraform -chdir=modules/s3 validate

  terraform-apply:
    executor: terraform-executor
    steps:
      - checkout
      - run:
          name: Install Terraform
          command: |
            curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
            unzip -o /tmp/terraform.zip -d /tmp/terraform-bin
            sudo mv /tmp/terraform-bin/terraform /usr/local/bin/terraform
            terraform version
      - run:
          name: Terraform init
          command: terraform -chdir=modules/s3 init -backend=false
      - run:
          name: Terraform apply
          command: |
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"
            export TF_VAR_bucket_name="${TF_BUCKET_NAME:-roshawsproject-dev-bucket}"
            terraform -chdir=modules/s3 apply -auto-approve -var="bucket_name=${TF_VAR_bucket_name}"

workflows:
  terraform_pipeline:
    jobs:
      - terraform-validate
      - terraform-apply:
          requires:
            - terraform-validate
          filters:
            branches:
              only: main