version: 2.1

executors:
  terraform-executor:
    docker:
      - image: cimg/base:stable
    resource_class: medium

jobs:
  terraform-validate:
    executor: terraform-executor
    steps:
      - checkout
      - run:
          name: Determine target module
          command: |
            COMMIT_MESSAGE="${CIRCLE_COMMIT_MESSAGE:-}"
            MODULE="s3"
            if [[ "$COMMIT_MESSAGE" =~ tf_init,([a-zA-Z0-9_-]+) ]]; then
              REQUESTED="${BASH_REMATCH[1]}"
              for candidate in ec2 eks iam s3 vpc; do
                if [[ "$candidate" == "$REQUESTED" ]]; then
                  MODULE="$REQUESTED"
                  break
                fi
              done
            fi
            echo "Using module: $MODULE"
            echo "export TARGET_MODULE=$MODULE" >> "$BASH_ENV"
      - run:
          name: Install Terraform
          command: |
            curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
            unzip -o /tmp/terraform.zip -d /tmp/terraform-bin
            sudo mv /tmp/terraform-bin/terraform /usr/local/bin/terraform
            terraform version
      - run:
          name: Terraform fmt check
          command: terraform fmt -check -recursive
      - run:
          name: Terraform init
          command: terraform -chdir="modules/${TARGET_MODULE}" init -backend=false
      - run:
          name: Terraform validate
          command: terraform -chdir="modules/${TARGET_MODULE}" validate

  terraform-apply:
    executor: terraform-executor
    steps:
      - checkout
      - run:
          name: Determine target module
          command: |
            COMMIT_MESSAGE="${CIRCLE_COMMIT_MESSAGE:-}"
            MODULE="s3"
            if [[ "$COMMIT_MESSAGE" =~ tf_init,([a-zA-Z0-9_-]+) ]]; then
              REQUESTED="${BASH_REMATCH[1]}"
              for candidate in ec2 eks iam s3 vpc; do
                if [[ "$candidate" == "$REQUESTED" ]]; then
                  MODULE="$REQUESTED"
                  break
                fi
              done
            fi
            echo "Using module: $MODULE"
            echo "export TARGET_MODULE=$MODULE" >> "$BASH_ENV"
      - run:
          name: Select AWS role by branch
          command: |
            if [[ "${CIRCLE_BRANCH}" == "main" ]]; then
              echo "export AWS_ROLE_ARN=${AWS_PROD_ROLE_ARN}" >> "$BASH_ENV"
              echo "export TF_VAR_environment=prod" >> "$BASH_ENV"
            else
              echo "export AWS_ROLE_ARN=${AWS_NONPROD_ROLE_ARN}" >> "$BASH_ENV"
              echo "export TF_VAR_environment=nonprod" >> "$BASH_ENV"
            fi
      - run:
          name: Install Terraform
          command: |
            curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
            unzip -o /tmp/terraform.zip -d /tmp/terraform-bin
            sudo mv /tmp/terraform-bin/terraform /usr/local/bin/terraform
            terraform version
      - run:
          name: Terraform init
          command: terraform -chdir="modules/${TARGET_MODULE}" init -backend=false
      - run:
          name: Terraform apply
          command: |
            export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"
            export AWS_ROLE_ARN="${AWS_ROLE_ARN:-}"
            if [[ "$TARGET_MODULE" == "s3" ]]; then
              export TF_VAR_bucket_name="${TF_BUCKET_NAME:-roshawsproject-${TF_VAR_environment:-dev}-bucket}"
              terraform -chdir="modules/${TARGET_MODULE}" apply -auto-approve -var="bucket_name=${TF_VAR_bucket_name}" -var="environment=${TF_VAR_environment:-nonprod}"
            else
              terraform -chdir="modules/${TARGET_MODULE}" apply -auto-approve -var="environment=${TF_VAR_environment:-nonprod}"
            fi

workflows:
  terraform_pipeline:
    jobs:
      - terraform-validate
      - terraform-apply:
          requires:
            - terraform-validate
          filters:
            branches:
              only:
                - develop
                - main